services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: horizon-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - horizon-network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: horizon-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - horizon-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: horizon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "33061:3306"
    volumes:
      - horizon-db-data:/var/lib/mysql
    networks:
      - horizon-network

networks:
  horizon-network:
    driver: bridge

volumes:
  horizon-db-data:
    driver: local
